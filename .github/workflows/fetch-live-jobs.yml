name: Fetch live job listings

on:
  schedule:
    # Daily ~6:00 AM Pacific (14:00 UTC)
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live jobs
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_USER_AGENT: ${{ secrets.USAJOBS_USER_AGENT }}
          LIVE_MAX_DAYS: "14"
          LIVE_MAX_JOBS: "150"
          LIVE_SEARCH_LOCATION: "Salem, OR"
        run: python scripts/fetch_live_jobs.py || true

      - name: Commit live-jobs.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-jobs.json
          git diff --staged --quiet || git commit -m "Update live job feed [automated]"
          git push
